name: Bug Report
description: Something isn't working
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect vs what actually happened?
    validations:
      required: true

  - type: textarea
    id: how-to-reproduce
    attributes:
      label: How to reproduce
      description: Steps, config (remove webhook URLs), or docker-compose snippet
      render: yaml

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Run with `ET_LOG_LEVEL=DEBUG` and paste relevant output (remove webhook URLs)
      render: shell

  - type: dropdown
    id: deployment-method
    attributes:
      label: How are you running EchoTube?
      options:
        - Docker Compose
        - Docker (docker run)
        - Node.js directly
    validations:
      required: true
