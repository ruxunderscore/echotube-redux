# EchoTube Docker Compose Configuration
# Copy .env.example to .env and customize with your settings

services:
  # Production deployment
  echotube:
    image: richardthornton/echotube:latest
    container_name: echotube
    restart: unless-stopped
    env_file: .env
    environment:
      ET_CACHE_FILE: "/app/cache/videos.json"
    volumes:
      - ./cache:/app/cache
    healthcheck:
      test: ["CMD", "node", "-e", "process.exit(0)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Test mode - safe testing without Discord posting
  echotube-test:
    image: richardthornton/echotube:latest
    container_name: echotube-test
    env_file: .env
    environment:
      ET_TEST_MODE: "true"
      ET_LOG_LEVEL: "DEBUG"
    restart: "no"
    profiles:
      - test

  # Development - builds locally, polls more frequently
  echotube-dev:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: echotube-dev
    env_file: .env
    environment:
      ET_POLL_INTERVAL_SECONDS: 60
      ET_LOG_LEVEL: "DEBUG"
      ET_CACHE_FILE: "/app/cache/videos-dev.json"
      ET_DEVELOPMENT_MODE: "true"
    volumes:
      - ./cache:/app/cache
    restart: unless-stopped
    profiles:
      - dev
